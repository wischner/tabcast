name: Debian package

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  package:
    name: Build Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      # inkerface is private, so the Makefile cannot download it here. It
      # is checked out where the Makefile would put it, at the revision
      # the Makefile pins, and the Makefile then leaves it alone.
      - name: Read the inkerface pin
        id: inkerface
        run: echo "revision=$(sed -n 's/^INKERFACE_REV := //p' Makefile)" >>"$GITHUB_OUTPUT"

      - name: Check out inkerface
        uses: actions/checkout@v6
        with:
          repository: wischner/inkerface
          ref: ${{ steps.inkerface.outputs.revision }}
          path: deps/inkerface

      - name: Derive Debian version from tag
        id: version
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          version="${RAW_TAG#v}"
          version="$(printf '%s' "$version" | LC_ALL=C sed -E \
            's/[^0-9A-Za-z.+~-]+/./g; s/^\.+//; s/\.+$//')"
          if [[ -z "$version" ]]; then
            version="0~git.${GITHUB_RUN_NUMBER}"
          elif [[ ! "$version" =~ ^[0-9] ]]; then
            version="0~$version"
          fi
          dpkg --validate-version "$version"
          echo "value=$version" >>"$GITHUB_OUTPUT"

      # The same build as on a desktop: make builds the image from
      # docker/Dockerfile and builds everything in it. The tests and the
      # package then run in that image too.
      - name: Build, test, and package on Ubuntu 24.04
        id: package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          make
          image="tabcast-build:$(sha256sum docker/Dockerfile | cut -c1-12)"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            --env PACKAGE_VERSION \
            "$image" \
            bash -euo pipefail -c '
              make -C evangelist check
              make -C apostle test SANITIZERS=undefined
              make -C disciple test SANITIZERS=undefined
              packaging/build-deb.sh "$PACKAGE_VERSION"
            '
          package_path="dist/tabcast_${PACKAGE_VERSION}_$(dpkg --print-architecture).deb"
          test -f "$package_path"
          dpkg-deb --info "$package_path"
          dpkg-deb --contents "$package_path"
          echo "path=$package_path" >>"$GITHUB_OUTPUT"

      - name: Verify installation on fresh Ubuntu
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          docker run --rm \
            --volume "$PWD:/work:ro" \
            --env PACKAGE_FILE="/work/$PACKAGE_PATH" \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              apt-get update
              apt-get install --yes "$PACKAGE_FILE"
              apostle --version
              disciple --version
              # Headless: no input, so it draws its splash and stops.
              INKERFACE_FRAME_PATH=/tmp/tabcast-frame.pbm disciple </dev/null
              test -s /tmp/tabcast-frame.pbm
              test -f /usr/share/tabcast/evangelist/evangelist-firefox.xpi
              test -f /usr/share/tabcast/evangelist/evangelist-chrome.zip
              ! find /usr/share/doc/tabcast -iname "README*" -print -quit \
                | grep .
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
