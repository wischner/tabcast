; Disciple firmware for the Xteink X4, built on inkerface.
;
; Disciple is an inkerface program. inkerface (the sibling repository
; ../../inkerface) is the platform: panel, buttons, Wi-Fi, storage. It is
; used here as a library, exactly as inkerface's own platformio.ini uses
; it, and FreeInk is linked from inkerface's download cache through the
; same symlinks. Every source in src/ is built; inkerface's Arduino
; setup() calls Disciple's program(). `make x4` fetches the SDK first.
;
; Another reader inkerface supports is another [env:...] here with that
; reader's board and FreeInk flags, mirroring inkerface's platformio.ini.
;
; Everything generated goes to the repository root's build/ and bin/,
; like every other part of tabcast. Use `make x4` in this directory.
;
; MIT License (see: LICENSE)
; Copyright (C) 2026 Tomaz Stih

[platformio]
default_envs = x4
src_dir = src
include_dir = include
; inkerface's lib/ holds its platform library and the FreeInk cache.
lib_dir = ../../inkerface/lib
build_dir = ../build/disciple/pio
libdeps_dir = ../build/disciple/pio/libdeps

[env:x4]
; The platform and flags inkerface and FreeInk are verified with.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = ../../inkerface/partitions-x4.csv
board_build.filesystem = littlefs

build_flags =
  -std=gnu++2a
  -I include
  -I ../../inkerface/include
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X4=1
build_unflags =
  -std=gnu++11

build_src_flags =
  -Wall -Wextra

; Link from archives, so only what Disciple uses costs flash.
lib_archive = yes
lib_ignore =
  freeink-sdk
  host-filesystems

lib_deps =
  inkerface
  BoardConfig=symlink://../../inkerface/lib/freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../../inkerface/lib/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://../../inkerface/lib/freeink-sdk/libs/hardware/InputManager
  XteinkDetect=symlink://../../inkerface/lib/freeink-sdk/libs/hardware/XteinkDetect
  SDCardManager=symlink://../../inkerface/lib/freeink-sdk/libs/hardware/SDCardManager
  FreeInkUI=symlink://../../inkerface/lib/freeink-sdk/libs/ui/FreeInkUI
  SecureNet=symlink://../../inkerface/lib/freeink-sdk/libs/network/SecureNet
  PowerManager=symlink://../../inkerface/lib/freeink-sdk/libs/hardware/PowerManager
