; Disciple firmware, on inkerface's latest release.
;
; Disciple is an inkerface program. inkerface is the platform: panel,
; buttons, Wi-Fi, storage. Each release ships a prebuilt library per
; reader, and beside it a platformio.ini with everything a program needs
; to link it: the exact platform and board it was built for, the flash
; layout, the flags, and the Arduino libraries it calls into. That file
; is included here (extra_configs), so the firmware always builds the
; way the release says, and this file adds only what is Disciple's own.
; Every source in src/ is built; inkerface's Arduino setup() calls
; Disciple's program().
;
; Where the release is comes from INKERFACE_DIR in the environment,
; which the Makefiles set to deps/inkerface. Build through make, never
; with pio directly.
;
; Every [env:...] here is a reader platform: `make PLATFORM=<env>`
; builds it and `make deploy PLATFORM=<env>` flashes it, and
; custom_description is what `make help` says about it. Another reader
; is another [env:...], once inkerface releases a library for it, with
; that release's platformio.ini added to extra_configs.
;
; Everything generated goes to the repository root's build/ and bin/,
; like every other part of tabcast.
;
; MIT License (see: LICENSE)
; Copyright (C) 2026 Tomaz Stih

[platformio]
default_envs = x4
src_dir = src
include_dir = include
build_dir = ../build/disciple/pio
libdeps_dir = ../build/disciple/pio/libdeps
extra_configs = ${sysenv.INKERFACE_DIR}/x4/platformio.ini

; Merged with the release's own [env:x4], which holds the platform,
; board, flags, and libraries. Nothing here repeats any of them.
[env:x4]
custom_description = Xteink X4
monitor_speed = 115200
upload_speed = 921600
build_src_flags =
  -Wall -Wextra
  ${sysenv.TABCAST_VERSION_FLAG}
